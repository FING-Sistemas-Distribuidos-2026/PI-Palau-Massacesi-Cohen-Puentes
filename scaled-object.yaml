apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: telephone-worker-scaler
  namespace: telephone-distortion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telephone-worker-deployment
  minReplicaCount: 0  
  maxReplicaCount: 8  
  # cooldownPeriod: cuántos segundos espera KEDA antes de bajar a 0
  # cuando la cola se vacía. 60s da margen para ráfagas seguidas.
  cooldownPeriod: 60
  triggers:
  - type: rabbitmq
    metadata:
      protocol: amqp
      queueName: telephone.jobs
      mode: QueueLength
      value: "100"   # 1 worker nuevo por cada 100 mensajes en cola
                     # 100 msgs → 1 pod, 200 → 2, ..., 800+ → 8 pods
    authenticationRef:
      name: rabbitmq-trigger-auth

---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
  namespace: telephone-distortion
spec:
  secretTargetRef:
  - parameter: host
    name: rabbitmq-keda-secret
    key: host
